name: fitlife_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  curved_navigation_bar: ^1.0.6
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.0.10+1

  # State Management (Compatible versions)
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # Icons
  cupertino_icons: ^1.0.8

  # Charts (Fixed compatibility issues)
  syncfusion_flutter_gauges: ^26.1.41
  fl_chart: ^0.68.0  # Downgraded to fix Matrix4 errors

  # Firebase (Compatible versions)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.6

  # File Handling (Stable versions)
  file_picker: ^8.1.4
  image_picker: ^1.1.2

  # Backend
  supabase_flutter: ^2.8.1

  # Local Package
  shared:
    path: ../shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Override dependencies to resolve conflicts
dependency_overrides:
  vector_math: ^2.1.4
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/