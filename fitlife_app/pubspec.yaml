name: fitlife_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  google_generative_ai: ^0.4.6
  curved_navigation_bar: ^1.0.6
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.0.10+1

  # State Management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1  # Use this version or higher

  # Icons
  cupertino_icons: ^1.0.8

  # Charts
  syncfusion_flutter_gauges: ^31.1.19
  fl_chart: ^1.2.0

  # Firebase (Fully aligned - NO conflicts)
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0
  firebase_app_check: ^0.4.3
  firebase_ai: ^3.11.0


  # File Handling
  file_picker: ^11.0.2
  image_picker: ^1.1.2


  # Backend (Optional alongside Firebase)
  supabase_flutter: ^2.8.1

  # Local Package
  shared:
    path: ../shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Minimal safe override (optional)
dependency_overrides:
  vector_math: ^2.1.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/